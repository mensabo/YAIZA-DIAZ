name: Desplegar en Raiola (preparación, aún no activo)

# Migración prevista de IONOS a Raiola (ver CLAUDE.md, pendiente #X).
# Este workflow es una copia del de IONOS apuntando a credenciales nuevas,
# pensado para probarse a mano (workflow_dispatch) mientras el despliegue
# automático en cada push sigue yendo a IONOS (deploy-ionos.yml) sin tocar.
# Cuando Raiola esté verificado y el dominio apunte allí, se puede:
#   1. Cambiar el `on:` de este archivo a `push: branches: [master]`.
#   2. Quitar (o poner en workflow_dispatch) el `on: push` de deploy-ionos.yml.
#
# Requiere estos 3 secrets nuevos en GitHub (Settings → Secrets → Actions),
# con los datos de la cuenta SFTP de Raiola:
#   RAIOLA_HOST, RAIOLA_USER, RAIOLA_PASSWORD
# Mismo supuesto que con IONOS: la cuenta SFTP debe estar ya acotada a la
# carpeta del sitio (el remoto "/" de esta conexión = raíz del sitio) —
# confirmar con Raiola/panel de hosting antes de la primera prueba.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias de build
        run: npm ci

      - name: Precalentar la primera imagen de Eventos/Entrevistas/Televisión
        run: node tools/preload-first-media.mjs

      - name: Generar style.css/script.js minificados
        run: npm run build

      - name: Subir por SFTP al espacio web de Raiola
        env:
          FTP_SERVER: ${{ secrets.RAIOLA_HOST }}
          FTP_USERNAME: ${{ secrets.RAIOLA_USER }}
          FTP_PASSWORD: ${{ secrets.RAIOLA_PASSWORD }}
        run: node tools/deploy-ionos-sftp.mjs
