name: Desplegar en Raiola por SFTP (respaldo manual, bloqueado por firewall)

# El sitio ya se despliega en producción vía deploy-raiola-pull.yml (Cron
# pull desde el cPanel de Raiola). Este workflow es el intento original por
# SFTP directo, descartado porque el firewall de la cuenta Raiola bloquea
# las conexiones entrantes -- se deja solo para probarlo a mano
# (workflow_dispatch) por si Raiola llega a levantar el bloqueo algún día,
# en cuyo caso sería una vía más directa que el Cron pull.
#
# Requiere estos 3 secrets en GitHub (Settings → Secrets → Actions), con
# los datos de la cuenta SFTP de Raiola:
#   RAIOLA_HOST, RAIOLA_USER, RAIOLA_PASSWORD
# La cuenta SFTP debe estar ya acotada a la carpeta del sitio (el remoto
# "/" de esta conexión = raíz del sitio).

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias de build
        run: npm ci

      - name: Precalentar la primera imagen de Eventos/Entrevistas/Televisión
        run: node tools/preload-first-media.mjs

      - name: Generar style.css/script.js minificados
        run: npm run build

      - name: Subir por SFTP al espacio web de Raiola
        env:
          FTP_SERVER: ${{ secrets.RAIOLA_HOST }}
          FTP_USERNAME: ${{ secrets.RAIOLA_USER }}
          FTP_PASSWORD: ${{ secrets.RAIOLA_PASSWORD }}
        run: node tools/deploy-raiola-sftp.mjs
