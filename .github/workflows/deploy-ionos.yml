name: Desplegar en IONOS

# Desactivado el disparo automatico en cada push (01/08/2026): el sitio ya
# se despliega en Raiola via deploy-raiola-pull.yml, e IONOS ya no es el
# destino real -- este workflow seguia intentando subir por SFTP en cada
# push y fallando siempre, generando un email de fallo por cada commit. Se
# deja solo el disparo manual (workflow_dispatch) por si algun dia hiciera
# falta reactivarlo a mano.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias de build
        run: npm ci

      - name: Precalentar la primera imagen de Eventos/Entrevistas/Televisión
        run: node tools/preload-first-media.mjs

      - name: Generar style.css/script.js minificados
        run: npm run build

      - name: Subir por SFTP al espacio web de IONOS (carpeta /YAIZADIAZ)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node tools/deploy-ionos-sftp.mjs
